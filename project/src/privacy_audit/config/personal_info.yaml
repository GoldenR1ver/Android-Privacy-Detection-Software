# Runtime network transmission (outbound HTTP). Not a "PII type" per se, but a
# first-class signal for Lab4-2 (consent: still uploading after switch-off?) and
# Lab4-3 (access / taint: did collected PII leave the device?). Captured by the
# OkHttp hook; URL + body let the analyzer match PII values against uploads.
network_transmission:
  aliases: ["网络传输", "数据上传", "上行请求"]
  policy_keywords: ["上传", "传输", "发送至服务器", "共享"]
  permissions: ["INTERNET"]
  apis: ["okhttp3.RealCall.execute", "okhttp3.RealCall.enqueue"]
  hooks: ["hook_network_okhttp.js"]
  api_targets: []
  network_keys: []
  related_rights: ["informed", "consent", "access"]
  sensitivity: ["normal"]
