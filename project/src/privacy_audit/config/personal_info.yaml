# Schema (Stage 0):
# pii_type:
#   aliases: [policy names, common variants]
#   policy_keywords: [keywords for policy parser]
#   permissions: [Android permissions]
#   apis: [static API signatures or method names]
#   hooks: [frida hook script names — loaded as plain Java.perform scripts]
#   api_targets: [data-driven targets for hook_papi.js]
#       - {clazz: "fully.qualified.Class", method: "methodName"}  # explicit
#       - {enumerate: "pkg.Class!method*"}                         # Java.enumerateMethods pattern
#   network_keys: [possible upload keys]
#   related_rights: [informed, consent, access, correction, deletion]
#   sensitivity: [normal | sensitive]
#
# api_targets feed the data-driven monitor (hook_papi.js) via Java.enumerateMethods
# + overload-aware hooking; the explicit hooks: scripts remain for hand-tuned cases.

imei:
  aliases: ["IMEI", "device_id", "设备号", "设备识别码"]
  policy_keywords: ["IMEI", "设备识别码", "设备标识符"]
  permissions: ["READ_PHONE_STATE"]
  apis: ["getImei", "getDeviceId", "TelephonyManager.getImei"]
  hooks: ["hook_imei.js"]
  api_targets:
    - {clazz: "android.telephony.TelephonyManager", method: "getImei"}
    - {clazz: "android.telephony.TelephonyManager", method: "getMeid"}
    - {clazz: "android.telephony.TelephonyManager", method: "getDeviceId"}
    - {clazz: "android.telephony.TelephonyManager", method: "getDeviceSoftwareVersion"}
    - {clazz: "android.telephony.TelephonyManager", method: "getSimSerialNumber"}
  network_keys: ["imei", "device_id"]
  related_rights: ["informed", "consent", "access", "deletion"]
  sensitivity: ["sensitive"]

