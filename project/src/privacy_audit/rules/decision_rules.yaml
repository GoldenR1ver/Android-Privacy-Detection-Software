# Stage 1 decision matrix for rule engine.
# The compare engine reads this file without LLM dependency.

rules:
  - when: "declared and observed"
    verdict: "consistent"
    risk_level: "low"
    message: "Policy declared and runtime/static evidence observed."
    evidence_fields: ["claims.declared_pii", "evidence.observed_pii"]

  - when: "not_declared and observed"
    verdict: "inconsistent_high_risk"
    risk_level: "high"
    message: "Observed without declaration in policy."
    evidence_fields: ["evidence.observed_pii"]

  - when: "declared and not_observed"
    verdict: "declared_not_observed"
    risk_level: "medium"
    message: "Declared in policy but not observed in current evidence."
    evidence_fields: ["claims.declared_pii"]

  - when: "declared and kb_supported"
    verdict: "kb_supported_consistent"
    risk_level: "low"
    message: "Declared; KB feasible evidence supports collection (no direct technical trace)."
    evidence_fields: ["claims.declared_pii", "feasible_evidence"]

  - when: "not_declared and kb_only"
    verdict: "kb_inferred_undeclared"
    risk_level: "high"
    message: "KB high-confidence inference without policy declaration or technical trace."
    evidence_fields: ["feasible_evidence", "evidence.observed_pii_kb"]
